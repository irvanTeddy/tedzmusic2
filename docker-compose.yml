version: '3.8'

services:
  innertube-api:
    build: ./innertube
    container_name: music-innertube
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - music-net
    deploy:
      resources:
        limits:
          memory: 256M

  frontend-web:
    build: ./frontend
    container_name: music-frontend
    restart: unless-stopped
    ports:
      - "8015:80"
    environment:
      - VITE_API_URL=https://api-music.irvanteddy.my.id
    networks:
      - music-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  music-net:
    external: true
