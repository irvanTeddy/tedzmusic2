services:
  innertube-api:
    build: ./innertube
    container_name: music-innertube
    restart: unless-stopped
    environment:
      - PORT=3001
    deploy:
      resources:
        limits:
          memory: 256M

  frontend-web:
    build: ./frontend
    container_name: music-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
